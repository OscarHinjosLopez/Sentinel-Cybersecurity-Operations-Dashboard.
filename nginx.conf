server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  location = /index.html {
    expires -1;
  }

  # Only content-hashed Angular bundles are immutable; public scripts are not.
  location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
    try_files $uri =404;
    expires 1y;
    # Repeat headers: nginx does not inherit add_header when a location adds one.
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?|json|map)$ {
    try_files $uri =404;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
