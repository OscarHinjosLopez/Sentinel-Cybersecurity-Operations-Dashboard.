<header>
  <div class="page-context">
    @if (mobile()) {
      <button
        matIconButton
        aria-label="Open navigation"
        aria-controls="sentinel-navigation"
        [attr.aria-expanded]="navigationOpen()"
        (click)="menuRequested.emit()"
      >
        <app-icon name="menu" />
      </button>
    }
    <app-breadcrumbs />
  </div>
  <div class="controls">
    <app-realtime-status [compact]="mobile()" />
    <button
      matIconButton
      aria-label="Open command palette"
      aria-keyshortcuts="Control+k Meta+k"
      matTooltip="Search commands (Ctrl / Cmd + K)"
      (click)="dialogs?.openPalette()"
    >
      <app-icon name="search" />
    </button>
    <button
      matIconButton
      [attr.aria-label]="'Notifications, ' + (notifications?.unreadCount() ?? 0) + ' unread'"
      [attr.aria-expanded]="notifications?.isOpen() ?? false"
      aria-haspopup="dialog"
      matTooltip="Notifications"
      (click)="notifications?.toggle()"
    >
      <app-icon
        name="bell"
        [matBadge]="notifications?.unreadCount() ?? 0"
        [matBadgeHidden]="!notifications?.hasUnread()"
        matBadgeSize="medium"
      />
    </button>
    <button
      class="desktop-control"
      matIconButton
      [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [matTooltip]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggle()"
    >
      <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" />
    </button>
    <button
      class="desktop-control"
      matIconButton
      aria-label="Keyboard shortcuts"
      matTooltip="Keyboard shortcuts (?)"
      (click)="dialogs?.openHelp()"
    >
      <app-icon name="help" />
    </button>
    <span class="separator" aria-hidden="true"></span>
    <button
      class="user-button"
      matButton
      [attr.aria-label]="auth.currentUser()?.name + ', user menu'"
      [matMenuTriggerFor]="userMenu"
    >
      <span class="avatar" aria-hidden="true">{{ initials() }}</span
      ><span class="user-label"
        ><span>{{ auth.currentUser()?.name }}</span
        ><small>{{ roleLabel() }}</small></span
      ><app-icon name="chevron" />
    </button>
  </div>
</header>
<mat-menu #userMenu="matMenu"
  ><div class="menu-preview">
    <strong>{{ auth.currentUser()?.name }}</strong>
    <p>{{ roleLabel() }}</p>
  </div>
  <button mat-menu-item (click)="theme.toggle()">
    {{ theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme' }}
  </button>
  <button mat-menu-item (click)="dialogs?.openHelp()">Keyboard shortcuts</button>
  <button mat-menu-item disabled>Profile</button
  ><button mat-menu-item (click)="auth.logout()">Sign out</button></mat-menu
>
