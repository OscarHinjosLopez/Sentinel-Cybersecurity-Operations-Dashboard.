<a class="skip-link" href="#main-content" (click)="skipToContent($event, mainContent)"
  >Skip to main content</a
>
<mat-sidenav-container>
  <mat-sidenav
    id="sentinel-navigation"
    [mode]="mobile() ? 'over' : 'side'"
    [opened]="!mobile() || drawerOpen()"
    [autoFocus]="mobile()"
    (closedStart)="drawerOpen.set(false)"
  >
    <app-sidebar [mobile]="mobile()" (closeRequested)="drawerOpen.set(false)" />
  </mat-sidenav>
  <mat-sidenav-content>
    <app-header
      [mobile]="mobile()"
      [navigationOpen]="drawerOpen()"
      (menuRequested)="drawerOpen.set(!drawerOpen())"
    />
    <main #mainContent id="main-content" tabindex="-1">
      <div class="page-content"><router-outlet /></div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
